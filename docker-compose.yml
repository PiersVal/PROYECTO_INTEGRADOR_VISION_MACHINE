services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    environment:
      - ENVIRONMENT=development

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000

volumes:
  data:
